<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5B1426">
<meta name="robots" content="noindex">
<title>Page introuvable | Oh My Donut Reims</title>
<link rel="icon" href="favicon-64.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Baloo+2:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#EC4C8A;--pink-deep:#C92E6C;--bordeaux:#5B1426;--choco-soft:#7A4A36;--cream:#FBF7F3}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Baloo 2",system-ui,sans-serif;background:var(--cream);line-height:1.6;font-size:17px;min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px 16px}
img{width:140px;margin:0 auto 20px}
h1{font-family:"Kaushan Script",cursive;font-weight:400;color:var(--bordeaux);font-size:clamp(2.4rem,7vw,3.6rem);line-height:1.05;margin-bottom:12px}
p{color:var(--choco-soft);margin-bottom:28px}
.btn{display:inline-block;background:var(--pink);color:#fff;text-decoration:none;font-weight:700;padding:.8em 1.5em;border-radius:999px;box-shadow:0 6px 0 var(--pink-deep)}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
</style>
</head>
<body>
<main>
<img src="logo-emblem.webp" alt="" style="width:160px">
<h1>Oups, ce donut a été mangé</h1>
<p>La page que tu cherches n'existe pas ou a été déplacée.</p>
<a class="btn" href="/">Retour à la carte</a>
</main>
</body>
</html>
